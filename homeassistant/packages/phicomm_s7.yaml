automation:
  # Member 4 is now a preset member (created on install), so keep the
  # legacy "created" flag permanently on so all dashboard cards show.
  - id: s7_member4_preset_flag
    alias: S7 Keep Member 4 Preset Flag On
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.s7_member4_created

  - id: s7_birthdate_text_migration
    alias: S7 Migrate Existing Birth Dates To Text Fields
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - variables:
                new_date: "{{ states('input_text.s7_member' ~ repeat.item ~ '_birthdate') }}"
                old_date: "{{ states('input_datetime.s7_member' ~ repeat.item ~ '_birthdate') }}"
            - if:
                - condition: template
                  value_template: "{{ new_date in ['', 'unknown', 'unavailable'] and old_date not in ['', 'unknown', 'unavailable'] }}"
              then:
                - action: input_text.set_value
                  target:
                    entity_id: "{{ 'input_text.s7_member' ~ repeat.item ~ '_birthdate' }}"
                  data:
                    value: "{{ as_datetime(old_date).strftime('%Y-%m-%d') }}"

  - id: s7_birthdate_age_sync
    alias: S7 Calculate Age From Birth Date
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_text.s7_member1_birthdate
          - input_text.s7_member2_birthdate
          - input_text.s7_member3_birthdate
          - input_text.s7_member4_birthdate
          - input_datetime.s7_member1_birthdate
          - input_datetime.s7_member2_birthdate
          - input_datetime.s7_member3_birthdate
          - input_datetime.s7_member4_birthdate
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "00:05:00"
    actions:
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - variables:
                birthdate: >-
                  {{ states('input_text.s7_member' ~ repeat.item ~ '_birthdate')
                     if states('input_text.s7_member' ~ repeat.item ~ '_birthdate') not in ['', 'unknown', 'unavailable']
                     else states('input_datetime.s7_member' ~ repeat.item ~ '_birthdate') }}
                calculated_age: >-
                  {% set b = as_datetime(birthdate, none) %}
                  {{ now().year - b.year - (1 if (now().month, now().day) < (b.month, b.day) else 0) if b else -1 }}
            - if:
                - condition: template
                  value_template: "{{ birthdate not in ['', 'unknown', 'unavailable'] and calculated_age | int(-1) >= 0 }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ 'input_number.s7_member' ~ repeat.item ~ '_age' }}"
                  data:
                    value: "{{ calculated_age | int }}"

  - id: s7_profile_sync
    alias: S7 Sync Selected Profile
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_number.s7_member1_age
          - input_number.s7_member1_height
          - input_select.s7_member1_sex
          - input_number.s7_member2_age
          - input_number.s7_member2_height
          - input_select.s7_member2_sex
          - input_number.s7_member3_age
          - input_number.s7_member3_height
          - input_select.s7_member3_sex
          - input_number.s7_member4_age
          - input_number.s7_member4_height
          - input_select.s7_member4_sex
    conditions:
      - condition: state
        entity_id: input_select.s7_measurement_status
        state: Waiting
      - condition: state
        entity_id: binary_sensor.phicomm_s7_mcu_online
        state: "on"
    actions:
      - action: script.s7_apply_profile

  # The scale wakes because a person steps on it. Wait for API + sensor states,
  # then arm the pending member before the MCU is allowed to scan.
  - id: s7_device_online_sync
    alias: S7 Sync Pending Member After Wake
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.phicomm_s7_mcu_online
        to: "on"
      # Also catch the first ESPHome entity becoming available after API reconnect.
      - trigger: state
        entity_id: number.phicomm_s7_age
      - trigger: template
        value_template: >-
          {{ states('input_select.s7_measurement_status') == 'Waiting'
             and states('binary_sensor.phicomm_s7_mcu_online') == 'on'
             and states('sensor.phicomm_s7_weight') | float(0) > 3 }}
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:02"
      - condition: state
        entity_id: binary_sensor.phicomm_s7_mcu_online
        state: "on"
      - condition: state
        entity_id: input_select.s7_measurement_status
        state: Waiting
      - action: timer.start
        target:
          entity_id: timer.s7_measurement_waiting
        data:
          duration: "00:02:00"
      - action: script.s7_apply_profile
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.phicomm_s7_weight') | float(0) > 3 }}"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.s7_measurement_waiting
              - action: input_select.select_option
                target:
                  entity_id: input_select.s7_measurement_status
                data:
                  option: Measuring

  - id: s7_measurement_prepare_watchdog
    alias: S7 Measurement Preparation Watchdog
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.s7_measurement_status
        to: Preparing
        for: "00:00:15"
    conditions:
      - condition: state
        entity_id: input_select.s7_measurement_status
        state: Preparing
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.s7_measurement_status
        data:
          option: Error

  - id: s7_measurement_wait_timeout
    alias: S7 Measurement Waiting Timeout
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.s7_measurement_waiting
    conditions:
      - condition: state
        entity_id: input_select.s7_measurement_status
        state: Waiting
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.phicomm_s7_mcu_online
                state: "on"
            sequence:
              - action: esphome.phicomm_s7_clear_active_member
      - action: input_select.select_option
        target:
          entity_id: input_select.s7_measurement_status
        data:
          option: Idle
      - action: input_select.select_option
        target:
          entity_id: input_select.s7_measurement_target
        data:
          option: Unassigned
      - action: input_select.select_option
        target:
          entity_id: input_select.s7_active_person
        data:
          option: Unassigned

  # ESPHome sends one complete CSV record. The device keeps it in flash until
  # this automation stores it and calls the matching ACK action.
  # Persist each incoming record in a HA queue before ACKing the ESP8266.
  # Duplicate retransmissions reuse the existing slot; if the queue is full,
  # no ACK is sent and the ESP8266 retains its flash copy.
  - id: s7_receive_measurement
    alias: S7 Receive and Queue Measurement
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: esphome.s7_measurement
    variables:
      record_csv: "{{ trigger.event.data.record | default('') }}"
      measurement_id: "{{ trigger.event.data.record.split(',')[1] | int(0) if trigger.event.data.record.split(',') | length > 1 else 0 }}"
      pending_entity: >-
        {% set rid = trigger.event.data.record.split(',')[1] | int(0) if trigger.event.data.record.split(',') | length > 1 else 0 %}
        {% set ns = namespace(entity='') %}
        {% for i in range(1, 6) %}
          {% set e = 'input_text.s7_pending_' ~ i %}
          {% set p = states(e).split(',') %}
          {% if ns.entity == '' and p | length > 1 and p[0] == 'S7V2' and (p[1] | int(0)) == rid %}
            {% set ns.entity = e %}
          {% endif %}
        {% endfor %}
        {% if ns.entity == '' %}
          {% for i in range(1, 6) %}
            {% set e = 'input_text.s7_pending_' ~ i %}
            {% if ns.entity == '' and states(e) in ['', 'unknown', 'unavailable'] %}
              {% set ns.entity = e %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.entity }}
    conditions:
      - condition: template
        value_template: >-
          {{ record_csv.split(',')[0] == 'S7V2'
             and record_csv.split(',') | length == 21
             and measurement_id > 0
             and pending_entity | trim != '' }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.s7_measurement_status
        data:
          option: Saving
      - action: input_text.set_value
        target:
          entity_id: "{{ pending_entity | trim }}"
        data:
          value: "{{ record_csv }}"
      # Give HA's recorder a moment to persist the helper state before ACK.
      - delay: "00:00:01"
      # ACK only after the pending record has been written to a persistent HA helper.
      - action: esphome.phicomm_s7_ack_measurement
        data:
          measurement_id: "{{ measurement_id }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.s7_measurement_status
        data:
          option: Idle
      - action: input_select.select_option
        target:
          entity_id: input_select.s7_measurement_target
        data:
          option: Unassigned
      - action: input_select.select_option
        target:
          entity_id: input_select.s7_active_person
        data:
          option: Unassigned


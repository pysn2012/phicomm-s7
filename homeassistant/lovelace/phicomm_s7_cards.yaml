              name: 姓名
            - entity: input_text.s7_member2_birthdate
              name: 出生日期（YYYY-MM-DD）
            - entity: input_number.s7_member2_height
              name: 身高（cm）
            - entity: input_select.s7_member2_sex
              name: 性别
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.s7_member_2_weight
            name: 体重
          - entity: sensor.s7_member_2_bmi
            name: BMI
          - entity: sensor.s7_member_2_body_fat
            name: 体脂率
          - entity: sensor.s7_member_2_water
            name: 水分率
          - entity: sensor.s7_member_2_muscle
            name: 肌肉率
          - entity: sensor.s7_member_2_bmr
            name: 基础代谢
          - entity: sensor.s7_member_2_bone_mass
            name: 骨量

  - type: custom:stack-in-card
    mode: vertical
    cards:
      - type: custom:mushroom-template-card
        primary: "{{ states('input_text.s7_member3_name') if states('input_text.s7_member3_name') not in ['', 'unknown', 'unavailable'] else '家庭成员 3' }}"
        secondary: "年龄 {{ states('input_number.s7_member3_age') }} 岁 · 身高 {{ states('input_number.s7_member3_height') }} cm"
        icon: mdi:account
        icon_color: purple
        tap_action:
          action: perform-action
